            label: Portrait
            widget: image
            required: false
            default: ""
            hint: Choose an existing preview or upload an image. Only the resized, watermarked preview is
              published; the original stays on your device.
          - name: avatarAlt
            label: Portrait alternative text
            widget: string
            required: false
            default: ""
            hint: Required when a portrait is set.
          - name: links
            label: Profile links
            widget: list
            required: false
            default: []
            fields:
              - name: label
                label: Link label
                widget: string
                required: true
              - name: url
                label: URL
                widget: string
                required: true
                hint: Use a complete https:// URL, or a site path beginning with /.
            collapsed: true
          - name: photos
            label: Photo gallery (upload multiple pictures)
            widget: image
            required: false
            default: []
            media_library:
              allow_multiple: true
              config:
                multiple: true
                kinds:
                  - image
            hint: Select several pictures together, prepare and upload them, then insert the selection. Drag
              pictures to reorder them. Use Pictures, video & audio below for individual
              descriptions and captions.
          - name: media
            label: Pictures, video & audio
            widget: list
            required: false
            default: []
            fields:
              - name: type
                label: Media type
                widget: select
                required: true
                default: image
                options:
                  - image
                  - video
                  - audio
              - name: src
                label: Media file
                widget: file
                required: true
                hint: Upload a picture, GIF, audio or video, or reuse registered media. Choose the matching media
                  type above (GIFs are images). Timed media defaults to a short preview; full length
                  is an explicit choice. Originals stay on your device.
              - name: alt
                label: Description or alternative text
                widget: string
                required: false
                default: ""
                hint: Describe images for people who cannot see them; name video and audio content.
              - name: caption
                label: Caption
                widget: text
                required: false
                default: ""
              - name: poster
                label: Poster image
                widget: image
                required: false
                default: ""
                hint: Choose an existing preview or upload an image. Only the resized, watermarked preview is
                  published; the original stays on your device.
            collapsed: true
            label_singular: Picture, video or audio
            hint: Add as many items as you like. Each item has its own description and caption. Drag items to
              change their order.
      - name: devlog
        label: Devlog
        file: src/content/pages/devlog.json
        preview_path: /devlog/
        fields:
          - name: title
            label: Page heading
            widget: string
          - name: eyebrow
            label: Small heading
            widget: string
            required: false
            default: ""
          - name: intro
            label: Introduction
            widget: text
            required: false
            default: ""
      - name: life
        label: Life
        file: src/content/pages/life.json
        preview_path: /life/
        fields:
          - name: title
            label: Page heading
            widget: string
          - name: eyebrow
            label: Small heading
            widget: string
            required: false
            default: ""
          - name: intro
            label: Introduction
            widget: text
            required: false
            default: ""
      - name: gallery
        label: Gallery
        file: src/content/pages/gallery.json
        preview_path: /gallery/
        fields:
          - name: title
            label: Page heading
            widget: string
          - name: eyebrow
            label: Small heading
            widget: string
            required: false
            default: ""
          - name: intro
            label: Introduction
            widget: text
            required: false
            default: ""
      - name: music
        label: Music
        file: src/content/pages/music.json
        preview_path: /music/
        fields:
          - name: title
            label: Page heading
            widget: string
          - name: eyebrow
            label: Small heading
            widget: string
            required: false
            default: ""
          - name: intro
            label: Introduction
            widget: text
            required: false
            default: ""
      - name: subscribe
        label: Subscriptions
        file: src/content/pages/subscribe.json
        preview_path: /subscribe/
        fields:
          - name: title
            label: Page heading
            widget: string
          - name: eyebrow
            label: Small heading
            widget: string
            required: false
            default: ""
          - name: intro
            label: Introduction
            widget: text
            required: false
            default: ""
          - name: rssDescription
            label: RSS description
            widget: text
      - name: not-found
        label: 404 - Page not found
        file: src/content/pages/not-found.json
        preview_path: /404.html
        fields:
          - name: title
            label: Page heading
            widget: string
          - name: eyebrow
            label: Small heading
            widget: string
            required: false
            default: ""
          - name: intro
            label: Introduction
            widget: text
            required: false
            default: ""
    description: Edit every page here. Manage journal entries in Devlog and Life, artwork in Gallery,
      tracks in Music, and window titles and content in Windows.
  - name: gallery
    label: Gallery
    files:
      - name: gallery
        label: Gallery
        file: src/content/gallery.json
        fields:
          - name: items
            label: Gallery items
            widget: list
            required: false
            default: []
            fields:
              - name: id
                label: Unique ID
                widget: string
                required: true
                hint: Keep stable; must be unique within the gallery.
              - name: title
                label: Title
                widget: string
                required: true
              - name: topics
                label: Topics
                widget: list
                required: false
                default: []
                hint: Add one or more topics, such as Portraits, Nature or Game art. Reuse the same names to group
                  uploads.
                field:
                  name: topic
                  label: Topic
                  widget: string
                  pattern:
                    - .*\S.*
                    - Enter a topic name.
              - name: type
                label: Media type
                widget: select
                required: true
                default: image
                options:
                  - image
                  - video
              - name: src
                label: Media file
                widget: file
                required: true
                hint: Upload a picture, GIF or video, or reuse registered media. Choose the matching type above
                  (GIFs are images). Full-length videos and animations require an explicit choice.
                  Originals stay on your device.
                media_library:
                  config:
                    kinds:
                      - image
                      - video
              - name: alt
                label: Alternative text
                widget: string
                required: true
                hint: Describe the picture for people who cannot see it. Use Description below for the text shown with the post.
              - name: caption
                label: Description
                widget: text
                required: false
                default: ""
                hint: Shown below the picture and in the expanded viewer. Blank lines separate paragraphs.
              - name: poster
                label: Poster image
                widget: image
                required: false
                default: ""
                hint: Choose an existing preview or upload an image. Only the resized, watermarked preview is
                  published; the original stays on your device.
            collapsed: true
            summary: "{{fields.title}} · {{fields.topics}}"
  - name: music
    label: Music
    files:
      - name: music
        label: Music
        file: src/content/music.json
        fields:
          - name: tracks
            label: Tracks
            widget: list
            required: false
            default: []
            fields:
              - name: id
                label: Unique ID
                widget: string
                required: true
                hint: Keep stable; must be unique within the track list.
              - name: title
                label: Track title
                widget: string
                required: true
              - name: topics
                label: Topics
                widget: list
                required: false
                default: []
                hint: Add one or more topics, such as Piano, Soundtracks or Ambient. Reuse the same names to group
                  tracks.
                field:
                  name: topic
                  label: Topic
                  widget: string
                  pattern:
                    - .*\S.*
                    - Enter a topic name.
              - name: src
                label: Audio file
                widget: file
                required: true
                hint: Choose or upload audio, or use Insert from URL to reuse a registered /media/... MP3 copy.
                  Short previews are the default; full tracks require an explicit choice. Only the
                  processed listening copy is uploaded.
                media_library:
                  allow_multiple: false
                  config:
                    kinds:
                      - audio
              - name: cover
                label: Cover image
                widget: image
                required: false
                default: ""
                hint: Choose an existing preview or upload an image. Only the resized, watermarked preview is
                  published; the original stays on your device.
              - name: coverAlt
                label: Cover alternative text
                widget: string
                required: false
                default: ""
                hint: Required when cover art is set.
            collapsed: true
            summary: "{{fields.title}} · {{fields.topics}}"
  - name: windows
    label: Windows
    files:
      - name: windows
        label: Windows
        file: src/content/windows.json
        fields:
          - name: windows
            label: Desktop windows
            widget: list
            required: false
            default: []
            hint: Add, edit, reorder or delete windows here. Saved content is PUBLIC on GitHub, even when
              Enabled is off; deletion does not remove Git history. Keep built-in IDs and pages
              unchanged. Deleting or disabling an ordinary built-in window removes it. Keep
              site-settings, music-player and start-menu present, enabled, on page all and using
              default content so site controls continue working.
            fields:
              - name: id
                label: Unique window ID
                widget: string
                required: true
                hint: New windows MUST start with custom-, for example custom-welcome. Every ID must be unique. Keep
                  IDs stable so links to windows continue working. Never rename built-in IDs.
                pattern:
                  - ^[a-z0-9]+(?:-[a-z0-9]+)*$
                  - Use lowercase letters and numbers separated by single hyphens.
              - name: page
                label: Page
                widget: select
                required: true
                default: home
                hint: "Choose where a custom window appears: post means every journal article; all means every page.
                  Do not change a built-in window's assigned page. Reorder custom windows in this
                  list to change their order on the page."
                options:
                  - home
                  - devlog
                  - life
                  - post
                  - gallery
                  - music
                  - about
                  - subscribe
                  - not-found
                  - all
              - name: title
                label: Window title
                widget: string
                required: true
                default: New window
                pattern:
                  - .*\S.*
                  - Enter a title, not only spaces.
              - name: enabled
                label: Enabled - visible on website, NOT a privacy setting
                widget: boolean
                required: false
                default: false
                hint: Switch off while preparing a window. Its saved text is still public in this repository.
                  site-settings, music-player and start-menu must remain enabled.
              - name: tone
                label: Title bar color
                widget: select
                required: true
                default: sage
                options:
                  - sage
                  - pink
                  - lavender
              - name: floating
                label: Start as a floating window
                widget: boolean
                required: false
                default: false
                hint: Otherwise the window starts in the page layout. Keep this on for site-settings, music-player
                  and start-menu. Visitors can still move and resize windows.
              - name: initiallyClosed
                label: Start closed
                widget: boolean
                required: false
                default: false
                hint: Visitors can reopen ordinary windows from Start. Keep this on for start-menu so it opens only
                  when requested; site-settings and music-player can start open or closed. The
                  player's saved visibility takes precedence.
              - name: width
                label: Initial width (pixels)
                widget: number
                required: true
                default: 0
                hint: 0 keeps the existing automatic width. Use a whole number of pixels; the window is constrained
                  to the available screen.
                value_type: int
                min: 0
                step: 1
              - name: height
                label: Initial height (pixels)
                widget: number
                required: true
                default: 0
                hint: 0 keeps the existing automatic height. Use a whole number of pixels. Floating windows fit the
                  workspace; in-page windows scroll their content within this height.
                value_type: int
                min: 0
                step: 1
              - name: content
                label: What this window shows
                widget: select
                required: true
                default: text
                hint: default preserves the built-in content and is forbidden for custom windows. Other choices
                  replace a built-in window's content. site-settings, music-player and start-menu
                  must use default. Edit original default content in Pages, Devlog, Life, Gallery or
                  Music.
                options:
                  - default
                  - text
                  - media
                  - links
                  - devlog
                  - life
                  - gallery
                  - music
                  - subscribe
              - name: body
                label: Markdown text
                widget: markdown
                required: false
                default: ""
                hint: Write Markdown or use the rich-text editor. Pictures and GIFs are processed locally. Add audio
                  or video in the media fields below. Saved content is public on GitHub, including
                  drafts.
                editor_components:
                  - image
              - name: media
                label: Media previews
                widget: list
                required: false
                default: []
                hint: Choose media content to display these prepared previews in list order.
                fields:
                  - name: type
                    label: Media type
                    widget: select
                    required: true
                    default: image
                    options:
                      - image
                      - video
                      - audio
                  - name: src
                    label: Media file
                    widget: file
                    required: true
                    hint: Upload a picture, GIF, audio or video, or reuse registered media. Choose the matching media
                      type above (GIFs are images). Timed media defaults to a short preview; full
                      length is an explicit choice. Originals stay on your device.
                  - name: alt
                    label: Description or alternative text
                    widget: string
                    required: false
                    default: ""
                    hint: Describe images for people who cannot see them; name video and audio content.
                  - name: caption
                    label: Caption
                    widget: text
                    required: false
                    default: ""
                  - name: poster
                    label: Poster image
                    widget: image
                    required: false
                    default: ""
                    hint: Choose an existing preview or upload an image. Only the resized, watermarked preview is
                      published; the original stays on your device.
                collapsed: true
              - name: links
                label: Links
                widget: list
                required: false
                default: []
                hint: Choose links content to display these links in list order.
                fields:
                  - name: label
                    label: Link label
                    widget: string
                    required: true
                  - name: url
                    label: URL
                    widget: string
                    required: true
                    hint: Use a complete https:// URL, or a site path beginning with /.
                collapsed: true
              - name: items
                label: Selected item IDs (optional)
                widget: list
                required: false
                default: []
                hint: For devlog or life, enter published permanent URL slugs; for gallery, gallery IDs; for music,
                  track IDs. The order here is the display order. Leave empty to use all available
                  items. Draft and future posts cannot appear. Leave empty for other content types.
                  Disabled windows may keep unfinished selections.
                field:
                  name: item
                  label: Item
                  widget: string
                  required: true
              - name: limit
                label: Maximum list items
                widget: number
                required: true
                default: 0
                hint: Applies to media, links, devlog, life, gallery and music lists. 0 shows all available or
                  selected items. Otherwise enter a positive whole number to limit the displayed
                  list.
                value_type: int
                min: 0
                step: 1
            collapsed: true
