backend:
  name: gwenlium-github
  repo: gwenlium/gwenlium.github.io
  branch: main
  base_url: https://gwenlium-cms-auth.gwenlium.workers.dev
  auth_endpoint: auth
  site_domain: gwenlium.dev
site_url: https://gwenlium.dev
display_url: https://gwenlium.dev
logo_url: /avatar.webp
media_folder: public/media
public_folder: /media
media_library:
  name: gwenlium-previews
collections:
  - name: devlog
    label: Devlog
    folder: src/content/posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{fields.permalink}}"
    identifier_field: title
    preview_path: devlog/{{fields.permalink}}
    fields:
      - name: section
        widget: hidden
        default: devlog
      - name: draft
        label: Draft - excluded from the website, NOT private
        widget: boolean
        required: false
        default: true
        hint: This repository is PUBLIC. Saving a draft commits its text publicly on GitHub. Draft only
          hides a post from the website and RSS; it does not protect confidential content. Deleting
          a file does not remove Git history.
      - name: title
        label: Title
        widget: string
        required: true
        pattern:
          - .*\S.*
          - Enter a title, not only spaces.
      - name: permalink
        label: Permanent URL slug
        widget: string
        required: true
        hint: Must be unique across both journals. The address is /devlog/your-slug/. Keep it unchanged
          after publishing.
        pattern:
          - ^[a-z0-9]+(?:-[a-z0-9]+)*$
          - Use lowercase letters and numbers, separated by single hyphens.
      - name: date
        label: Publication date (UTC)
        widget: datetime
        required: true
        hint: Future dates stay off the website and RSS until a successful build on or after that UTC date.
          Draft must also be switched off.
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
      - name: excerpt
        label: Your excerpt
        widget: text
        required: false
        default: ""
        hint: Write the summary used in cards, metadata and RSS. Leave empty to omit it; no summary is
          generated.
      - name: tags
        label: Projects & topics
        widget: list
        required: false
        default: []
        field:
          name: item
          label: Item
          widget: string
          required: true
        hint: Use a consistent project name, such as ProtoReCompute, to group its devlog entries.
      - name: featured
        label: Feature this post
        widget: boolean
        required: false
        default: false
        hint: Available to the homepage when no specific published post is selected in Site settings.
      - name: cover
        label: Cover image
        widget: image
        required: false
        default: ""
        hint: Choose an existing preview or upload an image. Only the resized, watermarked preview is
          published; the original stays on your device.
      - name: coverAlt
        label: Cover alternative text
        widget: string
        required: false
        default: ""
        hint: Required when a cover is set. Describe what the image shows.
      - name: body
        label: Article
        widget: markdown
        required: false
        default: ""
        hint: Use the Image control in the rich-text editor to insert pictures where they belong in the
          article. Put a picture on its own line to keep it visible beside the following dialogue
          passages until the next picture or heading. Pictures and GIFs are processed locally. Add
          audio or video in the media fields below. Saved content is public on GitHub, including drafts.
        editor_components:
          - image
      - name: photos
        label: Photo gallery (upload multiple pictures)
        widget: image
        required: false
        default: []
        media_library:
          allow_multiple: true
          config:
            multiple: true
            kinds:
              - image
        hint: Select several pictures together, prepare and upload them, then insert the selection. Drag
          pictures to reorder them. Use Pictures, video & audio below for individual descriptions
          and captions.
      - name: media
        label: Pictures, video & audio
        widget: list
        required: false
        default: []
        fields:
          - name: type
            label: Media type
            widget: select
            required: true
            default: image
            options:
              - image
              - video
              - audio
          - name: src
            label: Media file
            widget: file
            required: true
            hint: Upload a picture, GIF, audio or video, or reuse registered media. Choose the matching media
              type above (GIFs are images). Timed media defaults to a short preview; full length is
              an explicit choice. Originals stay on your device.
          - name: alt
            label: Description or alternative text
            widget: string
            required: false
            default: ""
            hint: Describe images for people who cannot see them; name video and audio content.
          - name: caption
            label: Caption
            widget: text
            required: false
            default: ""
          - name: poster
            label: Poster image
            widget: image
            required: false
            default: ""
            hint: Choose an existing preview or upload an image. Only the resized, watermarked preview is
              published; the original stays on your device.
        collapsed: true
        label_singular: Picture, video or audio
        hint: Add as many items as you like. Each item has its own description and caption. Drag items to
          change their order.
    label_singular: Devlog post
    description: Games, code and creative projects. Use project tags to group updates about the same project.
    filter:
      field: section
      value: devlog
    summary: "{{title}} · {{date}}"
    sortable_fields:
      - date
      - title
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
      - label: Published or scheduled
        field: draft
        pattern: false
