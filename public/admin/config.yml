    label_singular: Life post
    description: Personal stories, everyday life, photos and videos.
    filter:
      field: section
      value: life
    summary: "{{title}} · {{date}}"
    sortable_fields:
      - date
      - title
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
      - label: Published or scheduled
        field: draft
        pattern: false
  - name: pages
    label: Pages
    files:
      - name: site
        label: Home & site settings
        file: src/content/site.json
        fields:
          - name: maintenanceEnabled
            label: Under maintenance
            widget: boolean
            required: false
            default: false
            hint: Turn on and publish, then wait for the website deployment to finish before editing. Visitors see the maintenance notice on every page; /admin/ remains accessible. Turn off and publish when ready to reopen. Local previews stay normal. This does not restrict the public repository, direct media URLs, or previously downloaded content.
          - name: maintenanceHeading
            label: Maintenance heading
            widget: string
            required: false
            default: A little maintenance
          - name: maintenanceMessage
            label: Maintenance message
            widget: text
            required: false
            default: I am updating the website. Please check back soon!
          - name: name
            label: Display name
            widget: string
            required: true
            default: Gwenlium
          - name: watermarkText
            label: Watermark credit
            widget: string
            required: false
            default: © Gwendolyn Ural Erkut · gwenlium.dev
            hint: A small translucent credit on new image and video uploads. Existing uploads keep their
              original watermark.
            pattern:
              - ^.{1,200}$
              - Use 1 to 200 characters.
          - name: description
            label: Site description
            widget: text
            required: false
            default: ""
            hint: Used for search previews and on Home when Homepage introduction is empty. All fields in this
              public repository are publicly readable.
          - name: intro
            label: Homepage introduction
            widget: text
            required: false
            default: ""
          - name: status
            label: Short status
            widget: string
            required: false
            default: ""
          - name: githubUrl
            label: GitHub profile URL
            widget: string
            required: false
            default: https://github.com/gwenlium
          - name: featuredPost
            label: Featured post slug
            widget: string
            required: false
            default: ""
            hint: Select a published entry by its permanent URL slug. Leave empty to use a featured post, then
              the latest post.
            pattern:
              - ^$|^[a-z0-9]+(?:-[a-z0-9]+)*$
              - Leave empty or enter the permanent URL slug of a post.
          - name: newsletterUrl
            label: follow.it subscription URL
            widget: string
            required: false
            default: ""
            hint: Create your publisher feed on follow.it using https://gwenlium.dev/rss.xml and paste its
              public subscription URL. follow.it delivers new posts automatically. Leave empty to
              disable email signup. No credentials or API keys here.
            pattern:
              - ^$|^https://(www\.)?follow\.it/[^\s]+$
              - Enter your real https://follow.it/ feed subscription URL, or leave empty.
          - name: newsletterFormAction
            label: follow.it form action URL
            widget: string
            required: false
            default: ""
            hint: Public subscription-form URL only. Never enter a password, secret key, or subscriber address.
            pattern:
              - ^$|^https://api\.follow\.it/subscription-form/[^\s]+$
              - Paste the HTTPS form action supplied by follow.it.
          - name: newsletterHeading
            label: Newsletter heading
            widget: string
            required: false
            default: ""
          - name: newsletterButtonLabel
            label: Newsletter button text
            widget: string
            required: false
            default: Subscribe
          - name: game
            label: Featured game in Devlog
            widget: object
            required: false
            fields:
              - name: title
                label: Game title
                widget: string
                required: false
                default: ""
              - name: description
                label: Description
                widget: text
                required: false
                default: ""
              - name: status
                label: Development status
                widget: string
                required: false
                default: ""
              - name: cover
                label: Cover image
                widget: image
                required: false
                default: ""
                hint: Project artwork for social previews and trailers. To show a picture with a journal entry, set
                  that post’s Cover image.
              - name: coverAlt
                label: Cover alternative text
                widget: string
                required: false
                default: ""
                hint: Required when a cover is set.
              - name: trailerUrl
                label: Trailer URL
                widget: string
                required: false
                default: ""
                hint: Public YouTube/Vimeo trailer link, or an imported /media/... MP4 preview URL. External
                  trailers are not protected.
              - name: links
                label: Game links
                widget: list
                required: false
                default: []
                fields:
                  - name: label
                    label: Link label
                    widget: string
                    required: true
                  - name: url
                    label: URL
                    widget: string
                    required: true
                    hint: Use a complete https:// URL, or a site path beginning with /.
                collapsed: true
            hint: This showcase appears inside Devlog and on the homepage. Write development updates in the
              Devlog collection; there is no separate Game page.
        preview_path: /
      - name: about
        label: About
        file: src/content/pages/about.json
