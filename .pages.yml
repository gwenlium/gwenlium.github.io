components:
  link:
    type: object
    fields:
      - name: label
        label: Link label
        type: string
        required: true
      - name: url
        label: URL
        type: string
        required: true
        description: Use a complete https:// URL, or a site path beginning with /.
  media:
    type: object
    fields:
      - name: type
        label: Media type
        type: select
        default: image
        required: true
        options:
          values: [image, video, audio]
      - name: src
        label: Prepared preview URL
        type: string
        required: true
        description: "Paste the /media/... URL printed by npm run media:import. Never upload or commit original masters."
      - name: alt
        label: Description or alternative text
        type: string
        default: ""
        description: Describe images for people who cannot see them; name video and audio content.
      - name: caption
        label: Caption
        type: text
        default: ""
      - name: poster
        label: Prepared poster preview URL
        type: string
        default: ""
        description: Import the poster image first, then paste its /media/... preview URL. Leave empty to omit it.

content:
  - name: posts
    label: Devlog
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename:
      template: "{fields.permalink}.md"
      field: false
    subfolders: false
    exclude: [".gitkeep"]
    view:
      primary: title
      fields: [title, date, draft]
      sort: [date, title]
      search: [title, excerpt, body, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: draft
        label: Draft — excluded from the website, NOT private
        type: boolean
        default: true
        description: "This repository is PUBLIC. Saving a draft commits its text publicly on GitHub. Draft only hides a post from the website and RSS; it does not protect confidential content. Deleting a file does not remove Git history."
      - name: title
        label: Title
        type: string
        required: true
        pattern:
          regex: '.*\S.*'
          message: Enter a title, not only spaces.
      - name: permalink
        label: Permanent URL slug
        type: string
        required: true
        pattern:
          regex: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          message: Use lowercase letters and numbers, separated by single hyphens.
        description: "Must be unique. The address is /devlog/your-slug/. Keep this unchanged after publication so shared links continue to work."
      - name: date
        label: Publication date (UTC)
        type: date
        required: true
        options:
          time: false
          format: yyyy-MM-dd
        description: Future dates stay off the website and RSS until a successful build on or after that UTC date. Draft must also be switched off.
      - name: excerpt
        label: Your excerpt
        type: text
        default: ""
        description: Write the summary used in cards, metadata and RSS. Leave empty to omit it; no summary is generated.
      - name: tags
        label: Tags
        type: string
        list: true
        default: []
      - name: featured
        label: Feature this post
        type: boolean
        default: false
        description: Available to the homepage when no specific published post is selected in Site settings.
      - name: cover
        label: Prepared cover preview URL
        type: string
        default: ""
        description: Import the cover image first, then paste its /media/... preview URL. Never use an original master.
      - name: coverAlt
        label: Cover alternative text
        type: string
        default: ""
        description: Required when a cover is set. Describe what the image shows.
      - name: body
        label: Article
        type: rich-text
        default: ""
        description: "Write Markdown here. Uploads are disabled. In Source mode, insert ![meaningful alternative text](/media/your-prepared-preview.webp) using the exact URL printed by media:import. Saved drafts and previews are public."
        options:
          format: markdown
          switcher: true
          media: false
      - name: media
        label: Additional media
        component: media
        list:
          collapsible:
            collapsed: true
            summary: "{type}: {caption}"
        default: []

  - name: site
    label: Site, game & about
    type: file
    path: src/content/site.json
    format: json
    fields:
      - name: name
        label: Display name
        type: string
        default: Gwenlium
        required: true
      - name: description
        label: Site description
        type: text
        default: ""
        description: Your description for search engines and previews. All fields in this public repository are publicly readable.
      - name: intro
        label: Homepage introduction
        type: text
        default: ""
      - name: status
        label: Short status
        type: string
        default: ""
      - name: githubUrl
        label: GitHub profile URL
        type: string
        default: https://github.com/gwenlium
      - name: featuredPost
        label: Featured post slug
        type: string
        default: ""
        pattern:
          regex: '^$|^[a-z0-9]+(?:-[a-z0-9]+)*$'
          message: Leave empty or enter the permanent URL slug of a post.
        description: Select a published entry by its permanent URL slug. Leave empty to use a featured post, then the latest post.
      - name: newsletterUrl
        label: follow.it subscription URL
        type: string
        default: ""
        pattern:
          regex: '^$|^https://(www\.)?follow\.it/[^\s]+$'
          message: Enter your real https://follow.it/ feed subscription URL, or leave empty.
        description: "Create your publisher feed on follow.it using https://gwenlium.dev/rss.xml and paste its public subscription URL. follow.it delivers new posts automatically. Leave empty to disable email signup. No credentials or API keys here."
      - name: newsletterFormAction
        label: follow.it form action URL
        type: string
        default: ""
        pattern:
          regex: '^$|^https://api\.follow\.it/subscription-form/[^\s]+$'
          message: Paste the HTTPS form action supplied by follow.it.
        description: Public subscription-form URL only. Never enter a password, secret key, or subscriber address.
      - name: newsletterHeading
        label: Newsletter heading
        type: string
        default: ""
      - name: newsletterButtonLabel
        label: Newsletter button text
        type: string
        default: Subscribe
      - name: game
        label: Game
        type: object
        fields:
          - name: title
            label: Game title
            type: string
            default: ""
          - name: description
            label: Description
            type: text
            default: ""
          - name: status
            label: Development status
            type: string
            default: ""
          - name: cover
            label: Prepared cover preview URL
            type: string
            default: ""
            description: Import the image first, then paste its /media/... preview URL.
          - name: coverAlt
            label: Cover alternative text
            type: string
            default: ""
            description: Required when a cover is set.
          - name: trailerUrl
            label: Trailer URL
            type: string
            default: ""
            description: Public YouTube/Vimeo trailer link, or an imported /media/... MP4 preview URL. External trailers are not protected.
          - name: links
            label: Game links
            component: link
            list: true
            default: []
      - name: about
        label: About
        type: object
        fields:
          - name: body
            label: Your bio
            type: text
            default: ""
            description: Plain text; blank lines separate paragraphs.
          - name: avatar
            label: Portrait preview URL
            type: string
            default: ""
            description: Use /avatar.webp for the intentionally public profile image, or import a portrait and paste its /media/... preview URL.
          - name: avatarAlt
            label: Portrait alternative text
            type: string
            default: ""
            description: Required when a portrait is set.
          - name: links
            label: Profile links
            component: link
            list: true
            default: []

  - name: gallery
    label: Gallery
    type: file
    path: src/content/gallery.json
    format: json
    fields:
      - name: items
        label: Gallery items
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        default: []
        fields:
          - name: id
            label: Unique ID
            type: string
            required: true
            description: Keep stable; must be unique within the gallery.
          - name: title
            label: Title
            type: string
            required: true
          - name: type
            label: Media type
            type: select
            required: true
            default: image
            options:
              values: [image, video]
          - name: src
            label: Prepared image or video preview URL
            type: string
            required: true
            description: "Paste the /media/... URL printed by npm run media:import. Keep original masters outside this repository."
          - name: alt
            label: Description / alternative text
            type: string
            required: true
          - name: caption
            label: Caption
            type: text
            default: ""
          - name: poster
            label: Prepared poster preview URL
            type: string
            default: ""
            description: Import the poster image first, then paste its /media/... preview URL.

  - name: music
    label: Music
    type: file
    path: src/content/music.json
    format: json
    fields:
      - name: tracks
        label: Tracks
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        default: []
        fields:
          - name: id
            label: Unique ID
            type: string
            required: true
            description: Keep stable; must be unique within the track list.
          - name: title
            label: Track title
            type: string
            required: true
          - name: src
            label: Prepared audio preview URL
            type: string
            required: true
            description: Import the original audio outside this repository, then paste the generated /media/... MP3 preview URL.
          - name: cover
            label: Prepared cover preview URL
            type: string
            default: ""
            description: Import the cover image first, then paste its /media/... preview URL.
          - name: coverAlt
            label: Cover alternative text
            type: string
            default: ""
            description: Required when cover art is set.

  - name: windows
    label: Windows
    type: file
    path: src/content/windows.json
    format: json
    fields:
      - name: windows
        label: Desktop windows
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} ({id})"
        default: []
        description: "Add, edit, reorder or delete windows here. Saved content is PUBLIC on GitHub, even when Enabled is off; deletion does not remove Git history. Keep built-in IDs and pages unchanged. Deleting or disabling an ordinary built-in window removes it. Keep site-settings, music-player and start-menu present, enabled, on page all and using default content so site controls continue working."
        fields:
          - name: id
            label: Unique window ID
            type: string
            required: true
            pattern:
              regex: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
              message: Use lowercase letters and numbers separated by single hyphens.
            description: "New windows MUST start with custom-, for example custom-welcome. Every ID must be unique. Keep IDs stable so links to windows continue working. Never rename built-in IDs."
          - name: page
            label: Page
            type: select
            required: true
            default: home
            options:
              values: [home, devlog, post, game, gallery, music, about, subscribe, not-found, all]
            description: "Choose where a custom window appears: post means every devlog article; all means every page. Do not change a built-in window's assigned page. Reorder custom windows in this list to change their order on the page."
          - name: title
            label: Window title
            type: string
            required: true
            default: New window
            pattern:
              regex: '.*\S.*'
              message: Enter a title, not only spaces.
          - name: enabled
            label: Enabled — visible on website, NOT a privacy setting
            type: boolean
            default: false
            description: "Switch off while preparing a window. Its saved text is still public in this repository. site-settings, music-player and start-menu must remain enabled."
          - name: tone
            label: Title bar color
            type: select
            required: true
            default: sage
            options:
              values: [sage, pink, lavender]
          - name: floating
            label: Start as a floating window
            type: boolean
            default: false
            description: "Otherwise the window starts in the page layout. Keep this on for site-settings, music-player and start-menu. Visitors can still move and resize windows."
          - name: initiallyClosed
            label: Start closed
            type: boolean
            default: false
            description: "Visitors can reopen ordinary windows from Start. Keep this on for start-menu so it opens only when requested; site-settings and music-player can start open or closed. The player's saved visibility takes precedence."
          - name: width
            label: Initial width (pixels)
            type: number
            required: true
            default: 0
            options:
              min: 0
              step: 1
            description: "0 keeps the existing automatic width. Use a whole number of pixels; the window is constrained to the available screen."
          - name: height
            label: Initial height (pixels)
            type: number
            required: true
            default: 0
            options:
              min: 0
              step: 1
            description: "0 keeps the existing automatic height. Use a whole number of pixels. Floating windows fit the workspace; in-page windows scroll their content within this height."
          - name: content
            label: What this window shows
            type: select
            required: true
            default: text
            options:
              values: [default, text, media, links, devlog, gallery, music, subscribe]
            description: "default preserves the built-in content and is forbidden for custom windows. Other choices replace a built-in window's content. site-settings, music-player and start-menu must use default. Edit original default content in Site, Devlog, Gallery or Music."
          - name: body
            label: Markdown text
            type: rich-text
            default: ""
            description: "Write Markdown here; embedded HTML and uploads are disabled. In Source mode, use ![meaningful alternative text](/media/your-prepared-preview.webp) with the exact URL printed by media:import. Never commit original masters. All saved content, including disabled windows, is public."
            options:
              format: markdown
              switcher: true
              media: false
          - name: media
            label: Media previews
            component: media
            list:
              collapsible:
                collapsed: true
                summary: "{type}: {caption}"
            default: []
            description: Choose media content to display these prepared previews in list order.
          - name: links
            label: Links
            component: link
            list: true
            default: []
            description: Choose links content to display these links in list order.
          - name: items
            label: Selected item IDs (optional)
            type: string
            list: true
            default: []
            description: "For devlog, enter published permanent URL slugs; for gallery, gallery IDs; for music, track IDs. The order here is the display order. Leave empty to use all available items. Draft and future posts cannot appear. Leave empty for other content types. Disabled windows may keep unfinished selections."
          - name: limit
            label: Maximum list items
            type: number
            required: true
            default: 0
            options:
              min: 0
              step: 1
            description: "Applies to media, links, devlog, gallery and music lists. 0 shows all available or selected items. Otherwise enter a positive whole number to limit the displayed list."
